<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahorros Interactivos - Billetes y Monedas</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f5f2eb; /* Fondo beige plano */
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }
        .text-container {
            position: absolute;
            text-align: center;
            z-index: 10;
            pointer-events: none; /* Permite que el mouse interactúe con el canvas debajo */
            width: 80%;
            max-width: 600px;
        }
        h1 {
            font-size: 30px;
            color: #2c3e50;
            margin: 0;
            line-height: 1.4;
        }
        p {
            font-size: 16px;
            color: #7f8c8d;
            margin-top: 10px;
            letter-spacing: 0.5px;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
    </style>
</head>
<body>

    <div class="text-container">
        <h1>Oh, so that’s how you purchased your tablet!</h1>
        <p>Pasa el cursor sobre los billetes y monedas</p>
    </div>

    <canvas id="particleCanvas"></canvas>

    <script>
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Control de posición del Mouse / Dedo
        const mouse = {
            x: -1000,
            y: -1000,
            radius: 130 // Radio de interacción
        };

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('mouseleave', () => {
            mouse.x = -1000;
            mouse.y = -1000;
        });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                mouse.x = e.touches[0].clientX;
                mouse.y = e.touches[0].clientY;
            }
        }, { passive: true });

        window.addEventListener('touchend', () => {
            mouse.x = -1000;
            mouse.y = -1000;
        });

        let items = [];
        const totalItems = 100; // Cantidad total de partículas (monedas y billetes)

        for (let i = 0; i < totalItems; i++) {
            items.push({
                type: Math.random() > 0.5 ? 'coin' : 'bill', // Alternar entre moneda y billete
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                vx: (Math.random() - 0.5) * 0.7,
                vy: (Math.random() - 0.5) * 0.7,
                size: Math.random() * 8 + 8, // Escala
                angle: Math.random() * Math.PI * 2,
                spinSpeed: (Math.random() - 0.5) * 0.03
            });
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            items.forEach(item => {
                // Movimiento flotante
                item.x += item.vx;
                item.y += item.vy;
                item.angle += item.spinSpeed;

                // Rebotar en los bordes
                if (item.x < 0 || item.x > canvas.width) item.vx *= -1;
                if (item.y < 0 || item.y > canvas.height) item.vy *= -1;

                // Interacción con el Mouse (Efecto repelente)
                const dx = mouse.x - item.x;
                const dy = mouse.y - item.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < mouse.radius) {
                    const angle = Math.atan2(dy, dx);
                    const force = (mouse.radius - distance) / mouse.radius;
                    item.x -= Math.cos(angle) * force * 9;
                    item.y -= Math.sin(angle) * force * 9;
                }

                ctx.save();
                ctx.translate(item.x, item.y);
                ctx.rotate(item.angle);

                if (item.type === 'coin') {
                    // --- DIBUJAR MONEDA ---
                    ctx.fillStyle = '#f1c40f';
                    ctx.strokeStyle = '#d4ac0d';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    const scaleX = Math.cos(item.angle);
                    ctx.ellipse(0, 0, item.size * Math.abs(scaleX), item.size, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                } else {
                    // --- DIBUJAR BILLETE ---
                    ctx.fillStyle = '#2ecc71'; // Verde billete
                    ctx.strokeStyle = '#27ae60';
                    ctx.lineWidth = 2;
                    
                    const w = item.size * 2.2;
                    const h = item.size * 1.3;
                    
                    ctx.fillRect(-w / 2, -h / 2, w, h);
                    ctx.strokeRect(-w / 2, -h / 2, w, h);

                    // Detalles internos del billete (círculo central y líneas)
                    ctx.fillStyle = '#27ae60';
                    ctx.beginPath();
                    ctx.arc(0, 0, h * 0.25, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
